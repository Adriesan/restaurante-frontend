<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo de Órdenes - Restaurante</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="max-w-6xl mx-auto p-4 md:p-8 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Panel Izquierdo: Selección de Cliente, Tipo y Menú -->
      <div class="md:col-span-2 space-y-6">
        <div class="bg-white p-6 rounded-xl shadow-sm space-y-4">
          <h2 class="text-lg font-bold text-gray-800">1. Datos del Pedido</h2>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Cliente</label>
              <select id="select-cliente" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">-- Cliente Mostrador / Público --</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Tipo de Pedido *</label>
              <select id="tipo-pedido" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
                <option value="Local">🍽️ Comer Aquí</option>
                <option value="Llevar">🛍️ Para Llevar</option>
                <option value="Domicilio">🛵 A Domicilio</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Menú de Platillos -->
        <div class="bg-white p-6 rounded-xl shadow-sm space-y-4">
          <h2 class="text-lg font-bold text-gray-800">2. Menú / Agregar Platillos</h2>
          <div id="grid-platillos" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <p class="text-gray-400">Cargando menú...</p>
          </div>
        </div>
      </div>

      <!-- Panel Derecho: Carrito / Comanda -->
      <div class="bg-white p-6 rounded-xl shadow-sm h-fit space-y-4">
        <h2 class="text-lg font-bold text-gray-800 border-b pb-2">📋 Detalle de la Orden</h2>
        
        <div id="carrito-items" class="space-y-3 min-h-[150px]">
          <p class="text-xs text-gray-400 text-center py-4">No hay productos agregados</p>
        </div>

        <div class="border-t pt-4 space-y-2">
          <div class="flex justify-between font-bold text-lg text-gray-800">
            <span>Total:</span>
            <span id="total-orden">Q 0.00</span>
          </div>

          <button onclick="guardarOrden()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition shadow-sm">
            Guardar Orden
          </button>
        </div>
      </div>

    </div>
  </div>

  
  <script>
    cargarNavbar('ordenes');
    const API_URL = "https://restaurante-backend-7wjy.onrender.com";
    let carrito = [];

    async function iniciar() {
      // Cargar Clientes
      const resClientes = await fetch(`${API_URL}/clientes`);
      const clientes = await resClientes.json();
      const selectC = document.getElementById('select-cliente');
      clientes.forEach(c => {
        selectC.innerHTML += `<option value="${c.id}">${c.nombre} (${c.telefono || 'Sin tel'})</option>`;
      });

      // Cargar Platillos
      const resPlatillos = await fetch(`${API_URL}/platillos`);
      const platillos = await resPlatillos.json();
      const grid = document.getElementById('grid-platillos');
      grid.innerHTML = '';
      platillos.forEach(p => {
        if(p.disponible) {
          grid.innerHTML += `
            <div class="border p-3 rounded-lg flex justify-between items-center hover:border-blue-500 transition cursor-pointer" onclick="agregarAlCarrito(${p.id}, '${p.nombre}', ${p.precio})">
              <div>
                <div class="font-semibold text-sm text-gray-800">${p.nombre}</div>
                <div class="text-xs text-blue-600 font-bold">Q ${p.precio.toFixed(2)}</div>
              </div>
              <button class="bg-blue-50 text-blue-600 font-bold px-2.5 py-1 rounded-lg text-xs hover:bg-blue-100">+</button>
            </div>
          `;
        }
      });
    }

    function agregarAlCarrito(id, nombre, precio) {
      const existe = carrito.find(item => item.platillo_id === id);
      if(existe) {
        existe.cantidad += 1;
      } else {
        carrito.push({ platillo_id: id, nombre, precio_unitario: precio, cantidad: 1, notas: "" });
      }
      renderizarCarrito();
    }

    function renderizarCarrito() {
      const contenedor = document.getElementById('carrito-items');
      contenedor.innerHTML = '';
      let total = 0;

      carrito.forEach((item, index) => {
        const subtotal = item.cantidad * item.precio_unitario;
        total += subtotal;
        contenedor.innerHTML += `
          <div class="flex justify-between items-center text-sm border-b pb-2">
            <div>
              <div class="font-medium text-gray-800">${item.nombre}</div>
              <div class="text-xs text-gray-400">Q ${item.precio_unitario.toFixed(2)} x ${item.cantidad}</div>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-gray-700">Q ${subtotal.toFixed(2)}</span>
              <button onclick="eliminarDelCarrito(${index})" class="text-red-500 text-xs hover:text-red-700">🗑️</button>
            </div>
          </div>
        `;
      });

      document.getElementById('total-orden').innerText = `Q ${total.toFixed(2)}`;
    }

    function eliminarDelCarrito(index) {
      carrito.splice(index, 1);
      renderizarCarrito();
    }

    async function guardarOrden() {
      if(carrito.length === 0) return alert("Agrega al menos un producto a la orden");

      const payload = {
        cliente_id: document.getElementById('select-cliente').value || null,
        tipo_pedido: document.getElementById('tipo-pedido').value,
        detalles: carrito
      };

      const res = await fetch(`${API_URL}/ordenes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if(res.ok) {
        alert("¡Orden guardada exitosamente!");
        carrito = [];
        renderizarCarrito();
      } else {
        alert("Error al guardar la orden");
      }
    }

    iniciar();
  </script>
</body>
<script src="navbar.js"></script>
</html>
