<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo de Productos - Restaurante</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
     <!-- Navegación -->
    <div class="flex gap-4">
      <a href="index.html" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-semibold hover:bg-gray-300">📦 Productos</a>
      <a href="clientes.html" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold">👥 Clientes</a>
    </div>
    <!-- Encabezado -->
    <div class="bg-white p-6 rounded-xl shadow-sm flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">Módulo de Productos</h1>
        <p class="text-sm text-gray-500">Administra los platillos y su disponibilidad en Quetzales (Q)</p>
      </div>
      <button onclick="cargarProductos()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-sm font-medium transition">
        🔄 Recargar
      </button>
    </div>

    <!-- Formulario para Registrar Platillo -->
    <div class="bg-white p-6 rounded-xl shadow-sm">
      <h2 class="text-lg font-semibold text-gray-700 mb-4">Agregar Nuevo Platillo</h2>
      <form id="form-producto" onsubmit="guardarPlatillo(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nombre</label>
          <input type="text" id="nombre" placeholder="Ej. Tacos al Pastor" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Precio (Q)</label>
          <input type="number" step="0.01" id="precio" placeholder="0.00" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Descripción</label>
          <input type="text" id="descripcion" placeholder="Ingredientes o detalle breve" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <button type="submit" id="btn-guardar" class="md:col-span-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow-sm">
          Guardar Platillo
        </button>
      </form>
    </div>

    <!-- Tabla Adaptable de Productos -->
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
        <h2 class="font-semibold text-gray-700">Inventario de Platillos</h2>
        <input type="text" id="buscador" onkeyup="buscarPlatillos()" placeholder="Buscar platillo..." class="border rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b text-xs font-semibold uppercase text-gray-400 bg-gray-50">
              <th class="p-4">Platillo</th>
              <th class="p-4">Descripción</th>
              <th class="p-4">Precio</th>
              <th class="p-4">Estado</th>
              <th class="p-4 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-platillos" class="divide-y text-sm text-gray-700">
            <tr>
              <td colspan="5" class="p-4 text-center text-gray-400">Cargando platillos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Modal para Editar Platillo -->
  <div id="modal-editar" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg p-6 max-w-md w-full space-y-4">
      <h3 class="text-lg font-bold text-gray-800">Editar Platillo</h3>
      <input type="hidden" id="edit-id">
      <input type="hidden" id="edit-disponible">
      
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nombre</label>
        <input type="text" id="edit-nombre" required class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Precio (Q)</label>
        <input type="number" step="0.01" id="edit-precio" required class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Descripción</label>
        <input type="text" id="edit-descripcion" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="cerrarModal()" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-100 text-sm">Cancelar</button>
        <button onclick="guardarEdicion()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-semibold">Guardar Cambios</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://restaurante-backend-7wjy.onrender.com";
    let listaPlatillos = [];

    async function cargarProductos() {
      try {
        const res = await fetch(`${API_URL}/platillos`);
        listaPlatillos = await res.json();
        renderizarTabla(listaPlatillos);
      } catch (err) {
        console.error("Error al cargar platillos:", err);
      }
    }

    function renderizarTabla(platillos) {
      const tbody = document.getElementById('tabla-platillos');
      tbody.innerHTML = '';

      if (platillos.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">No hay platillos registrados</td></tr>`;
        return;
      }

      platillos.forEach(p => {
        tbody.innerHTML += `
          <tr class="hover:bg-gray-50 transition">
            <td class="p-4 font-semibold text-gray-800">${p.nombre}</td>
            <td class="p-4 text-gray-500">${p.descripcion || '-'}</td>
            <td class="p-4 font-bold text-gray-700">Q${parseFloat(p.precio).toFixed(2)}</td>
            <td class="p-4">
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${p.disponible ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                ${p.disponible ? 'Activo' : 'Inactivo'}
              </span>
            </td>
            <td class="p-4 text-center">
              <div class="flex flex-col md:flex-row justify-center items-center gap-1.5">
                <button onclick="abrirModal(${p.id})" class="w-full md:w-auto px-2.5 py-1 rounded text-xs font-medium border border-blue-300 text-blue-600 hover:bg-blue-50">
                  ✏️ Editar
                </button>
                <button onclick="toggleEstado(${p.id}, '${p.nombre}', '${p.descripcion || ''}', ${p.precio}, ${!p.disponible})" 
                        class="w-full md:w-auto px-2.5 py-1 rounded text-xs font-medium border transition ${p.disponible ? 'border-red-300 text-red-600 hover:bg-red-50' : 'border-green-300 text-green-600 hover:bg-green-50'}">
                  ${p.disponible ? 'Inactivar' : 'Activar'}
                </button>
                <button onclick="eliminarPlatillo(${p.id}, '${p.nombre}')" class="w-full md:w-auto px-2.5 py-1 rounded text-xs font-medium border border-gray-300 text-gray-600 hover:bg-gray-100 hover:text-red-700 hover:border-red-400 transition">
                  🗑️ Eliminar
                </button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    // --- (Funciones existentes: guardarPlatillo, abrirModal, cerrarModal, guardarEdicion, toggleEstado, buscarPlatillos) ---

    async function guardarPlatillo(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-guardar');
      btn.innerText = "Guardando...";
      btn.disabled = true;

      const nuevoPlatillo = {
        nombre: document.getElementById('nombre').value,
        precio: parseFloat(document.getElementById('precio').value),
        descripcion: document.getElementById('descripcion').value,
        disponible: true
      };

      try {
        await fetch(`${API_URL}/platillos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(nuevoPlatillo)
        });

        document.getElementById('form-producto').reset();
        await cargarProductos();
      } catch (err) {
        alert("Error al guardar el platillo");
      } finally {
        btn.innerText = "Guardar Platillo";
        btn.disabled = false;
      }
    }

    function abrirModal(id) {
      const p = listaPlatillos.find(item => item.id === id);
      if (!p) return;

      document.getElementById('edit-id').value = p.id;
      document.getElementById('edit-nombre').value = p.nombre;
      document.getElementById('edit-precio').value = p.precio;
      document.getElementById('edit-descripcion').value = p.descripcion || '';
      document.getElementById('edit-disponible').value = p.disponible;

      document.getElementById('modal-editar').classList.remove('hidden');
    }

    function cerrarModal() {
      document.getElementById('modal-editar').classList.add('hidden');
    }

    async function guardarEdicion() {
      const id = document.getElementById('edit-id').value;
      const datosActualizados = {
        nombre: document.getElementById('edit-nombre').value,
        precio: parseFloat(document.getElementById('edit-precio').value),
        descripcion: document.getElementById('edit-descripcion').value,
        disponible: document.getElementById('edit-disponible').value === 'true'
      };

      try {
        await fetch(`${API_URL}/platillos/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datosActualizados)
        });
        cerrarModal();
        cargarProductos();
      } catch (err) {
        alert("Error al editar el platillo");
      }
    }

    async function toggleEstado(id, nombre, descripcion, precio, nuevoEstado) {
      try {
        await fetch(`${API_URL}/platillos/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre: nombre,
            descripcion: descripcion,
            precio: precio,
            disponible: nuevoEstado
          })
        });
        cargarProductos();
      } catch (err) {
        alert("Error al actualizar el estado");
      }
    }

    async function buscarPlatillos() {
      const query = document.getElementById('buscador').value;
      if (!query.trim()) {
        cargarProductos();
        return;
      }
      try {
        const res = await fetch(`${API_URL}/platillos/buscar?nombre=${query}`);
        const resultados = await res.json();
        renderizarTabla(resultados);
      } catch (err) {
        console.error("Error en la búsqueda:", err);
      }
    }

    // --- Nueva Función para Eliminar un Platillo ---
    async function eliminarPlatillo(id, nombre) {
      // 1. Mostrar una ventana de confirmación
      if (!confirm(`¿Estás seguro de que quieres eliminar definitivamente el platillo "${nombre}"? Esta acción no se puede deshacer.`)) {
        return; // El usuario canceló la acción
      }

      try {
        // 2. Enviar la petición DELETE al backend
        const res = await fetch(`${API_URL}/platillos/${id}`, {
          method: 'DELETE'
        });

        // 3. Verificar si la eliminación fue exitosa (código 204)
        if (res.status === 204) {
          // 4. Recargar la tabla para mostrar los cambios
          cargarProductos();
          alert(`El platillo "${nombre}" ha sido eliminado exitosamente.`);
        } else if (res.status === 404) {
          alert("El platillo no pudo ser encontrado. Puede que ya haya sido eliminado.");
          cargarProductos(); // Recargar la tabla para estar sincronizados
        } else {
          alert("Ocurrió un error inesperado al intentar eliminar el platillo.");
        }
      } catch (err) {
        console.error("Error al eliminar platillo:", err);
        alert("Ocurrió un error de red al intentar eliminar el platillo.");
      }
    }

    // Cargar la lista al abrir la página
    cargarProductos();
  </script>
</body>
<script src="navbar.js"></script>
<script>
  cargarNavbar('productos'); // Cambiar 'ordenes' por 'productos' o 'clientes' según la página
</script>
</html>
