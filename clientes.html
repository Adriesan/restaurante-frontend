<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo de Clientes - Restaurante</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Encabezado -->
    <div class="bg-white p-6 rounded-xl shadow-sm flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">Módulo de Clientes</h1>
        <p class="text-sm text-gray-500">Administra los datos de contacto y entrega de los clientes</p>
      </div>
      <button onclick="cargarClientes()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-sm font-medium transition">
        🔄 Recargar
      </button>
    </div>

    <!-- Formulario -->
    <div class="bg-white p-6 rounded-xl shadow-sm">
      <h2 class="text-lg font-semibold text-gray-700 mb-4">Registrar Nuevo Cliente</h2>
      <form id="form-cliente" onsubmit="guardarCliente(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nombre Completo *</label>
          <input type="text" id="nombre" placeholder="Ej. María López" required class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">NIT / C/F</label>
          <input type="text" id="nit" placeholder="CF o Número de NIT" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Teléfono Principal</label>
          <input type="text" id="telefono" placeholder="5555-1234" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Teléfono 2 (Secundario)</label>
          <input type="text" id="telefono_2" placeholder="4444-5678" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Dirección de Entrega</label>
          <input type="text" id="direccion" placeholder="Calle, avenida o número de casa" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Referencia de Dirección</label>
          <input type="text" id="referencia" placeholder="Ej. Frente al portón rojo, casa de 2 niveles" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Link de Ubicación (Maps / Waze)</label>
          <input type="url" id="ubicacion" placeholder="https://maps.app.goo.gl/..." class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Descripción / Notas del Cliente</label>
          <textarea id="descripcion" rows="2" placeholder="Ej. Cliente frecuente, pedir que toquen el timbre fuerte, prefiere pago con transferencia" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <button type="submit" id="btn-guardar" class="md:col-span-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow-sm">
          Guardar Cliente
        </button>
      </form>
    </div>

    <!-- Tabla de Clientes -->
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
        <h2 class="font-semibold text-gray-700">Directorio de Clientes</h2>
        <input type="text" id="buscador" onkeyup="buscarClientes()" placeholder="Buscar por nombre o teléfono..." class="border rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b text-xs font-semibold uppercase text-gray-400 bg-gray-50">
              <th class="p-4">Cliente / NIT</th>
              <th class="p-4">Teléfonos</th>
              <th class="p-4">Dirección y Referencia</th>
              <th class="p-4">Notas</th>
              <th class="p-4 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-clientes" class="divide-y text-sm text-gray-700">
            <tr>
              <td colspan="5" class="p-4 text-center text-gray-400">Cargando clientes...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Modal Copiar Datos -->
  <div id="modal-copiar" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-lg p-6 max-w-md w-full space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-gray-800">📋 Datos para Repartidor</h3>
        <button onclick="cerrarModalCopiar()" class="text-gray-400 hover:text-gray-600">✕</button>
      </div>

      <textarea id="texto-repartidor" rows="8" readonly class="w-full bg-gray-50 border rounded-lg p-3 text-sm font-mono text-gray-700 outline-none focus:ring-2 focus:ring-blue-500"></textarea>

      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="cerrarModalCopiar()" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-100 text-sm">Cerrar</button>
        <button onclick="copiarAlPortapapeles()" id="btn-copiar" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm font-semibold transition">
          📋 Copiar Texto
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Editar Cliente -->
  <div id="modal-editar" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center p-4 z-40">
    <div class="bg-white rounded-xl shadow-lg p-6 max-w-lg w-full space-y-4 max-h-[90vh] overflow-y-auto">
      <h3 class="text-lg font-bold text-gray-800">Editar Cliente</h3>
      <input type="hidden" id="edit-id">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nombre</label>
          <input type="text" id="edit-nombre" required class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">NIT</label>
          <input type="text" id="edit-nit" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Teléfono Principal</label>
          <input type="text" id="edit-telefono" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Teléfono 2</label>
          <input type="text" id="edit-telefono_2" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Dirección</label>
          <input type="text" id="edit-direccion" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Referencia</label>
          <input type="text" id="edit-referencia" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Link Ubicación</label>
          <input type="url" id="edit-ubicacion" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Descripción / Notas</label>
          <textarea id="edit-descripcion" rows="2" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="cerrarModal()" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-100 text-sm">Cancelar</button>
        <button onclick="guardarEdicion()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-semibold">Guardar Cambios</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://restaurante-backend-7wjy.onrender.com";
    let listaClientes = [];

    async function cargarClientes() {
      try {
        const res = await fetch(`${API_URL}/clientes`);
        listaClientes = await res.json();
        renderizarTabla(listaClientes);
      } catch (err) {
        console.error("Error al cargar clientes:", err);
      }
    }

    function renderizarTabla(clientes) {
      const tbody = document.getElementById('tabla-clientes');
      tbody.innerHTML = '';

      if (clientes.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">No hay clientes registrados</td></tr>`;
        return;
      }

      clientes.forEach(c => {
        tbody.innerHTML += `
          <tr class="hover:bg-gray-50 transition">
            <td class="p-4 font-semibold text-gray-800">
              ${c.nombre}
              <div class="text-xs text-gray-400">NIT: ${c.nit || 'CF'}</div>
            </td>
            <td class="p-4 text-gray-600">
              <div>${c.telefono || '-'}</div>
              ${c.telefono_2 ? `<div class="text-xs text-gray-400">Alt: ${c.telefono_2}</div>` : ''}
            </td>
            <td class="p-4 text-gray-500">
              <div class="font-medium text-gray-700">${c.direccion || '-'}</div>
              ${c.referencia ? `<div class="text-xs text-gray-400">Ref: ${c.referencia}</div>` : ''}
              ${c.ubicacion ? `<a href="${c.ubicacion}" target="_blank" class="text-xs text-blue-600 hover:underline inline-block mt-0.5">📍 Ver Mapa</a>` : ''}
            </td>
            <td class="p-4 text-gray-500 text-xs italic max-w-xs">
              ${c.descripcion || '-'}
            </td>
            <td class="p-4 text-center">
              <div class="flex justify-center items-center gap-1.5">
                <button onclick="abrirModalCopiar(${c.id})" class="px-2.5 py-1 rounded text-xs font-medium bg-green-600 text-white hover:bg-green-700 transition" title="Copiar datos para el repartidor">
                  📋 Copiar
                </button>
                <button onclick="abrirModal(${c.id})" class="px-2 py-1 rounded text-xs font-medium border border-blue-300 text-blue-600 hover:bg-blue-50">
                  ✏️
                </button>
                <button onclick="eliminarCliente(${c.id}, '${c.nombre}')" class="px-2 py-1 rounded text-xs font-medium border border-gray-300 text-gray-600 hover:bg-gray-100 hover:text-red-700 transition">
                  🗑️
                </button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    function abrirModalCopiar(id) {
      const c = listaClientes.find(item => item.id === id);
      if (!c) return;

      const texto = `🛵 ENTREGA A DOMICILIO\n\n` +
                    `👤 Cliente: ${c.nombre}\n` +
                    `📞 Teléfono: ${c.telefono || 'No especificado'}` + (c.telefono_2 ? ` / ${c.telefono_2}` : '') + `\n` +
                    `📍 Dirección: ${c.direccion || 'No especificada'}\n` +
                    `🏡 Referencia: ${c.referencia || 'Sin referencia'}\n` +
                    `🗺️ Ubicación: ${c.ubicacion || 'Sin enlace de mapa'}\n` +
                    `📝 Notas: ${c.descripcion || 'Ninguna'}\n` +
                    `📄 NIT: ${c.nit || 'CF'}`;

      document.getElementById('texto-repartidor').value = texto;
      document.getElementById('modal-copiar').classList.remove('hidden');
    }

    function cerrarModalCopiar() {
      document.getElementById('modal-copiar').classList.add('hidden');
    }

    function copiarAlPortapapeles() {
      const textarea = document.getElementById('texto-repartidor');
      textarea.select();
      navigator.clipboard.writeText(textarea.value);

      const btn = document.getElementById('btn-copiar');
      btn.innerText = "✅ ¡Copiado!";
      setTimeout(() => {
        btn.innerText = "📋 Copiar Texto";
      }, 2000);
    }

    async function guardarCliente(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-guardar');
      btn.innerText = "Guardando...";
      btn.disabled = true;

      const nuevoCliente = {
        nombre: document.getElementById('nombre').value,
        telefono: document.getElementById('telefono').value,
        telefono_2: document.getElementById('telefono_2').value,
        direccion: document.getElementById('direccion').value,
        referencia: document.getElementById('referencia').value,
        ubicacion: document.getElementById('ubicacion').value,
        descripcion: document.getElementById('descripcion').value,
        nit: document.getElementById('nit').value
      };

      try {
        await fetch(`${API_URL}/clientes`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(nuevoCliente)
        });

        document.getElementById('form-cliente').reset();
        await cargarClientes();
      } catch (err) {
        alert("Error al guardar el cliente");
      } finally {
        btn.innerText = "Guardar Cliente";
        btn.disabled = false;
      }
    }

    function abrirModal(id) {
      const c = listaClientes.find(item => item.id === id);
      if (!c) return;

      document.getElementById('edit-id').value = c.id;
      document.getElementById('edit-nombre').value = c.nombre;
      document.getElementById('edit-nit').value = c.nit || '';
      document.getElementById('edit-telefono').value = c.telefono || '';
      document.getElementById('edit-telefono_2').value = c.telefono_2 || '';
      document.getElementById('edit-direccion').value = c.direccion || '';
      document.getElementById('edit-referencia').value = c.referencia || '';
      document.getElementById('edit-ubicacion').value = c.ubicacion || '';
      document.getElementById('edit-descripcion').value = c.descripcion || '';

      document.getElementById('modal-editar').classList.remove('hidden');
    }

    function cerrarModal() {
      document.getElementById('modal-editar').classList.add('hidden');
    }

    async function guardarEdicion() {
      const id = document.getElementById('edit-id').value;
      const datosActualizados = {
        nombre: document.getElementById('edit-nombre').value,
        nit: document.getElementById('edit-nit').value,
        telefono: document.getElementById('edit-telefono').value,
        telefono_2: document.getElementById('edit-telefono_2').value,
        direccion: document.getElementById('edit-direccion').value,
        referencia: document.getElementById('edit-referencia').value,
        ubicacion: document.getElementById('edit-ubicacion').value,
        descripcion: document.getElementById('edit-descripcion').value
      };

      try {
        await fetch(`${API_URL}/clientes/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datosActualizados)
        });
        cerrarModal();
        cargarClientes();
      } catch (err) {
        alert("Error al editar cliente");
      }
    }

    async function eliminarCliente(id, nombre) {
      if (!confirm(`¿Deseas eliminar al cliente "${nombre}"?`)) return;

      try {
        await fetch(`${API_URL}/clientes/${id}`, { method: 'DELETE' });
        cargarClientes();
      } catch (err) {
        alert("Error al eliminar cliente");
      }
    }

    async function buscarClientes() {
      const query = document.getElementById('buscador').value;
      if (!query.trim()) {
        cargarClientes();
        return;
      }
      try {
        const res = await fetch(`${API_URL}/clientes/buscar?query=${query}`);
        const resultados = await res.json();
        renderizarTabla(resultados);
      } catch (err) {
        console.error("Error en la búsqueda:", err);
      }
    }

    cargarClientes();
  </script>
</body>
<script src="navbar.js"></script>
<script>
  cargarNavbar('clientes'); // Cambiar 'ordenes' por 'productos' o 'clientes' según la página
</script>
</html>
